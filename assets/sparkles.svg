<svg width="400" height="30" xmlns="http://www.w3.org/2000/svg">
  <text x="20" y="20" font-size="16">✨<animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/></text>
  <text x="100" y="20" font-size="16">⚡<animate attributeName="opacity" values="0.5;1;0.5" dur="1.5s" repeatCount="indefinite"/></text>
  <text x="180" y="20" font-size="16">🤖<animate attributeName="opacity" values="1;0.4;1" dur="2.5s" repeatCount="indefinite"/></text>
  <text x="260" y="20" font-size="16">🚀<animate attributeName="opacity" values="0.3;1;0.3" dur="1.8s" repeatCount="indefinite"/></text>
  <text x="340" y="20" font-size="16">💜<animate attributeName="opacity" values="1;0.5;1" dur="2.2s" repeatCount="indefinite"/></text>
</svg>