<svg width="720" height="140" xmlns="http://www.w3.org/2000/svg">
  <style>
    @media (prefers-color-scheme: light) {
      .card { fill: #ffffff; stroke: #d0d7de; }
      .prompt { fill: #7c3aed; }
      .body-text { fill: #1f2328; }
      .cursor { fill: #db2777; }
    }
  </style>
  <rect class="card" width="720" height="140" rx="12" fill="#0d1117" stroke="#1e293b" stroke-width="1"/>
  <!-- terminal dots -->
  <circle cx="20" cy="20" r="4" fill="#ef4444"/>
  <circle cx="35" cy="20" r="4" fill="#fbbf24"/>
  <circle cx="50" cy="20" r="4" fill="#22c55e"/>
  <text class="prompt" x="20" y="55" font-family="'SF Mono','Fira Code',monospace" font-size="16" fill="#8b5cf6">$ whoami</text>
  <text class="body-text" x="20" y="80" font-family="'SF Mono','Fira Code',monospace" font-size="15" fill="#c9d1d9">Sun Yat-sen University MSc · AI PM × Growth</text>
  <text class="body-text" x="20" y="105" font-family="'SF Mono','Fira Code',monospace" font-size="15" fill="#c9d1d9">ex-TikTok Shop · ex-Poizon · building in public</text>
  <!-- blinking cursor -->
  <rect class="cursor" x="20" y="115" width="10" height="16" fill="#ec4899">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>
  <text class="cursor" x="38" y="128" font-family="'SF Mono','Fira Code',monospace" font-size="15" fill="#ec4899">_</text>
</svg>
