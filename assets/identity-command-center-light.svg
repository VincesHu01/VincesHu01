<svg xmlns="http://www.w3.org/2000/svg" width="760" height="230" viewBox="0 0 760 230" role="img" aria-labelledby="title desc">
  <title id="title">VincesHu identity command center</title><desc id="desc">An animated, theme-aware profile console for an AI product builder.</desc>
  <defs>
    <linearGradient id="edge" x1="0" x2="1"><stop stop-color="#8b5cf6"/><stop offset=".48" stop-color="#ec4899"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop class="glass1" stop-color="#fff" stop-opacity=".10"/><stop class="glass2" offset="1" stop-color="#fff" stop-opacity=".025"/></linearGradient>
    <clipPath id="frame-clip"><rect width="760" height="230" rx="18"/></clipPath>
    <pattern id="grid" width="25" height="25" patternUnits="userSpaceOnUse"><path class="grid" d="M25 0H0V25" fill="none" stroke="#94a3b8" stroke-opacity=".055"/></pattern>
    <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      text{font-family:Inter,-apple-system,'Segoe UI',sans-serif}.mono{font-family:'SFMono-Regular',Consolas,monospace}.bg{fill:#070914}.panel{fill:url(#glass);stroke:#334155}.primary{fill:#f8fafc}.secondary{fill:#aab6ca}.muted{fill:#748198}.grid{stroke:#94a3b8}.label{font-size:9px;font-weight:800;letter-spacing:1.8px}.scan{animation:scan 5s linear infinite}.pulse{animation:pulse 2.2s ease-in-out infinite}.cursor{animation:blink 1s steps(2,end) infinite}@keyframes scan{from{transform:translateX(-160px)}to{transform:translateX(900px)}}@keyframes pulse{50%{opacity:.25}}@keyframes blink{50%{opacity:0}}
      .bg{fill:#fff}.panel{fill:#f8fafc;stroke:#d0d7de}.primary{fill:#24292f}.secondary{fill:#475569}.muted{fill:#6e7781}.grid{stroke:#7c3aed;stroke-opacity:.045}.glass1{stop-color:#7c3aed;stop-opacity:.05}.glass2{stop-color:#0891b2;stop-opacity:.015}
    </style>
  </defs>
  <rect class="bg" width="760" height="230" rx="18"/><rect width="760" height="230" rx="18" fill="url(#grid)"/><rect x="1" y="1" width="758" height="228" rx="17" fill="none" stroke="url(#edge)" stroke-width="2"/>
  <rect class="panel" x="18" y="16" width="724" height="36" rx="10"/><circle cx="37" cy="34" r="4" fill="#34d399" filter="url(#glow)" class="pulse"/><text x="50" y="37" class="label primary">IDENTITY NODE // VERIFIED</text><text x="721" y="37" text-anchor="end" class="mono muted" font-size="10">VINCESHU.OS · ONLINE</text>
  <g transform="translate(26 73)"><rect class="panel" width="160" height="128" rx="14"/><circle cx="80" cy="47" r="28" fill="none" stroke="url(#edge)" stroke-width="2"/><circle cx="80" cy="47" r="20" fill="#8b5cf6" fill-opacity=".16"/><text x="80" y="54" text-anchor="middle" font-size="19" font-weight="900" fill="#a78bfa">VH</text><text x="80" y="89" text-anchor="middle" class="primary" font-size="15" font-weight="800">VINCESHU</text><text x="80" y="108" text-anchor="middle" class="mono muted" font-size="9">AI × PRODUCT × GROWTH</text></g>
  <g transform="translate(204 73)"><text class="label" fill="#a78bfa" x="0" y="10">CURRENT VECTOR</text><text class="primary" x="0" y="38" font-size="21" font-weight="850">Building useful intelligence</text><text class="secondary" x="0" y="61" font-size="13">from messy, real-world workflows.</text><path d="M0 76H518" stroke="url(#edge)" stroke-opacity=".55"/>
    <g transform="translate(0 90)"><rect width="148" height="30" rx="15" fill="#8b5cf6" fill-opacity=".13" stroke="#8b5cf6" stroke-opacity=".45"/><text x="74" y="19" text-anchor="middle" font-size="10" font-weight="700" fill="#8b5cf6">SYSU · MSc</text></g><g transform="translate(158 90)"><rect width="166" height="30" rx="15" fill="#ec4899" fill-opacity=".11" stroke="#ec4899" stroke-opacity=".4"/><text x="83" y="19" text-anchor="middle" font-size="10" font-weight="700" fill="#ec4899">ex-TIKTOK · POIZON</text></g><g transform="translate(334 90)"><rect width="184" height="30" rx="15" fill="#22d3ee" fill-opacity=".11" stroke="#22d3ee" stroke-opacity=".4"/><text x="92" y="19" text-anchor="middle" font-size="10" font-weight="700" fill="#0891b2">SHIP → LEARN → REPEAT</text></g>
  </g><g clip-path="url(#frame-clip)"><rect x="0" y="0" width="140" height="2" fill="url(#edge)" opacity=".8" class="scan"/></g><rect x="718" y="191" width="8" height="14" fill="#ec4899" class="cursor"/><text x="703" y="201" text-anchor="end" class="mono muted" font-size="9">READY</text>
</svg>
