name: Refresh README cards

# 把第三方统计卡片抓成静态 SVG 提交回仓库，README 只引用仓库内的静态文件
# （经 jsDelivr CDN 分发）。这些公共 Vercel 实例随时会被作者暂停或限流
# （github-profile-trophy / activity-graph 目前就处于 DEPLOYMENT_PAUSED），
# 静态化之后 README 不会再出现裂图。
#
# 每张卡片生成两套，README 用 <picture> + prefers-color-scheme 按主题切换：
#   xxx.svg        → 深色版（GitHub dark 主题）
#   xxx-light.svg  → 浅色版（GitHub light 主题）
# 浅色版抓取失败时会自动用深色版兜底，任何主题下都不会裂图。
on:
  schedule:
    - cron: "20 16 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/readme-cards.yml"
      - ".github/scripts/activity_graph.py"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch card SVGs
        run: |
          set -u
          mkdir -p assets/cards

          # fetch <输出文件> <url1> [url2 ...]  —— 依次尝试，成功即停
          fetch() {
            local out="$1"; shift
            local url code
            for url in "$@"; do
              for i in 1 2 3; do
                code=$(curl -sS -L -m 45 \
                         -H "User-Agent: readme-card-refresh" \
                         -o "$out.tmp" -w "%{http_code}" "$url" || echo 000)
                if [ "$code" = "200" ] && grep -qi "<svg" "$out.tmp" \
                   && [ "$(wc -c < "$out.tmp")" -gt 1000 ]; then
                  mv "$out.tmp" "$out"
                  echo "OK   $out"
                  return 0
                fi
                sleep 6
              done
              echo "   ...$url 不可用，换下一个源"
            done
            rm -f "$out.tmp"
            echo "SKIP $out —— 所有源都失败，保留上一次生成的文件"
            return 0
          }

          # fallback <浅色文件> <深色文件> —— 浅色版没抓到就用深色版兜底，避免裂图
          fallback() {
            if [ -s "$1" ]; then
              echo "OK   $1"
            else
              cp "$2" "$1"
              echo "WARN $1 抓取失败，已用深色版兜底"
            fi
          }

          GRS="https://github-readme-stats.vercel.app"
          GRS_FAST="https://github-readme-stats-fast.vercel.app"
          T_COMMON="theme=tokyonight&bg_color=0d1117&text_color=c9d1d9&border_radius=12&hide_border=true"
          L_COMMON="theme=default&bg_color=ffffff&text_color=1f2328&border_radius=12&hide_border=false&border_color=d0d7de"

          fetch assets/cards/stats.svg \
            "${GRS}/api?username=VincesHu01&show_icons=true&title_color=8b5cf6&icon_color=ec4899&${T_COMMON}" \
            "${GRS_FAST}/api?username=VincesHu01&show_icons=true&title_color=8b5cf6&icon_color=ec4899&${T_COMMON}"
          fetch assets/cards/stats-light.svg \
            "${GRS}/api?username=VincesHu01&show_icons=true&title_color=7c3aed&icon_color=db2777&${L_COMMON}" \
            "${GRS_FAST}/api?username=VincesHu01&show_icons=true&title_color=7c3aed&icon_color=db2777&${L_COMMON}"
          fallback assets/cards/stats-light.svg assets/cards/stats.svg

          fetch assets/cards/top-langs.svg \
            "${GRS}/api/top-langs/?username=VincesHu01&layout=compact&title_color=8b5cf6&${T_COMMON}" \
            "${GRS_FAST}/api/top-langs/?username=VincesHu01&layout=compact&title_color=8b5cf6&${T_COMMON}"
          fetch assets/cards/top-langs-light.svg \
            "${GRS}/api/top-langs/?username=VincesHu01&layout=compact&title_color=7c3aed&${L_COMMON}" \
            "${GRS_FAST}/api/top-langs/?username=VincesHu01&layout=compact&title_color=7c3aed&${L_COMMON}"
          fallback assets/cards/top-langs-light.svg assets/cards/top-langs.svg

          # herokuapp 旧域名已退役，官方现域名是 demolab
          fetch assets/cards/streak.svg \
            "https://streak-stats.demolab.com/?user=VincesHu01&theme=tokyonight&background=0d1117&ring=8b5cf6&fire=ec4899&currStreakLabel=8b5cf6&sideLabels=c9d1d9&dates=c9d1d9&border_radius=12"
          fetch assets/cards/streak-light.svg \
            "https://streak-stats.demolab.com/?user=VincesHu01&theme=default&background=ffffff&ring=7c3aed&fire=db2777&currStreakLabel=7c3aed&sideLabels=57606a&dates=57606a&border_radius=12"
          fallback assets/cards/streak-light.svg assets/cards/streak.svg

          # 蛇图由 snake.yml 生成在 output 分支上，这里拷一份进 main。
          # 目的是让 README 能用「仓库相对路径」引用它：相对路径不走 camo 代理，
          # 图片外层的 <a href> 才会保留 #gh-light-mode-only 字面量，
          # GitHub 的 CSS（[href$="#gh-light-mode-only"]）才命中得上。
          fetch assets/cards/snake.svg \
            "https://cdn.jsdelivr.net/gh/VincesHu01/VincesHu01@output/github-contribution-grid-snake-dark.svg"
          fetch assets/cards/snake-light.svg \
            "https://cdn.jsdelivr.net/gh/VincesHu01/VincesHu01@output/github-contribution-grid-snake.svg"
          fallback assets/cards/snake-light.svg assets/cards/snake.svg

          # 原 github-profile-trophy.vercel.app 已被作者暂停，改用社区镜像
          fetch assets/cards/trophy.svg \
            "https://github-profile-trophy.screw-hand.vercel.app/?username=VincesHu01&theme=tokyonight&no-frame=true&no-bg=true&margin-w=8&row=1" \
            "https://github-profile-trophy.vercel.app/?username=VincesHu01&theme=tokyonight&no-frame=true&no-bg=true&margin-w=8&row=1"
          # 浅色版用 default 主题（白底 / 黑字 / 灰正文）。
          # 注意这里不能加 no-bg，否则白底被去掉、文字在白底 GitHub 上会看不见。
          fetch assets/cards/trophy-light.svg \
            "https://github-profile-trophy.screw-hand.vercel.app/?username=VincesHu01&theme=default&no-frame=true&margin-w=8&row=1" \
            "https://github-profile-trophy.vercel.app/?username=VincesHu01&theme=default&no-frame=true&margin-w=8&row=1"
          fallback assets/cards/trophy-light.svg assets/cards/trophy.svg

          pin() { # $1 = repo, $2 = 深色强调色, $3 = 浅色强调色
            fetch "assets/cards/pin-$1.svg" \
              "${GRS}/api/pin/?username=VincesHu01&repo=$1&theme=tokyonight&bg_color=0d1117&text_color=c9d1d9&title_color=$2&description_color=c9d1d9&border_color=$2&hide_border=true" \
              "${GRS_FAST}/api/pin/?username=VincesHu01&repo=$1&theme=tokyonight&bg_color=0d1117&text_color=c9d1d9&title_color=$2&description_color=c9d1d9&border_color=$2&hide_border=true"
            fetch "assets/cards/pin-$1-light.svg" \
              "${GRS}/api/pin/?username=VincesHu01&repo=$1&theme=default&bg_color=ffffff&text_color=57606a&title_color=$3&description_color=57606a&border_color=d0d7de&hide_border=false" \
              "${GRS_FAST}/api/pin/?username=VincesHu01&repo=$1&theme=default&bg_color=ffffff&text_color=57606a&title_color=$3&description_color=57606a&border_color=d0d7de&hide_border=false"
            fallback "assets/cards/pin-$1-light.svg" "assets/cards/pin-$1.svg"
          }
          pin timeless-career-intelligence 8b5cf6 6d28d9
          pin ai-news-aggregator ec4899 db2777
          pin Apex-workbench 22d3ee 0e7490
          pin douji fbbf24 b45309

      - name: Build activity graph
        run: |
          # github-readme-activity-graph 的公共实例已暂停，改为自己渲染
          curl -sS -m 45 -H "User-Agent: readme-card-refresh" \
            -o /tmp/contrib.json \
            "https://github-contributions-api.jogruber.de/v4/VincesHu01?y=last" || true
          if grep -q '"contributions"' /tmp/contrib.json; then
            for variant in dark light; do
              if [ "$variant" = "light" ]; then out="assets/cards/activity-light.svg"; else out="assets/cards/activity.svg"; fi
              python3 .github/scripts/activity_graph.py /tmp/contrib.json "$variant" > /tmp/activity-$variant.svg
              if [ -s /tmp/activity-$variant.svg ] && grep -q "<svg" /tmp/activity-$variant.svg; then
                mv /tmp/activity-$variant.svg "$out"
                echo "OK   $out"
              fi
            done
            [ -s assets/cards/activity-light.svg ] || cp assets/cards/activity.svg assets/cards/activity-light.svg
          else
            echo "SKIP activity.svg —— 贡献数据抓取失败，保留上一次生成的文件"
            [ -s assets/cards/activity-light.svg ] || cp assets/cards/activity.svg assets/cards/activity-light.svg
          fi

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/cards
          if git diff --cached --quiet; then
            echo "卡片无变化，跳过提交"
            exit 0
          fi
          git commit -m "chore: refresh README stat cards"
          git push origin HEAD:main
